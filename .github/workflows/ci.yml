name: CI

on:
  push:
    branches:
      - main
      - codex/personal
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify source contracts
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pnpm verify

      - name: Browser authorization contracts
        if: matrix.os == 'windows-latest'
        env:
          DEVSPACE_TEST_BROWSER: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: pnpm exec tsx --test src/oauth-redirect.browser.test.ts src/mcp-authorization.browser.test.ts src/ui/approval-card.browser.test.ts

      - name: Built ChatGPT approval UI
        if: matrix.os == 'windows-latest'
        env:
          DEVSPACE_TEST_BROWSER: C:\Program Files\Google\Chrome\Application\chrome.exe
          DEVSPACE_UI_BUILD_DIR: dist/ui
        run: pnpm exec tsx --test src/ui/approval-card.browser.test.ts

      - name: Doctor
        run: node dist/cli.js doctor

  runtime-compat:
    name: Runtime compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - '24'
          - '26'

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify declared runtime range
        run: pnpm verify
